name: archive-check

# ARCHIVE-CHECK (owner decision, 2026-10-04; docs/DECISIONS.md; batches OF-2): every 3
# hours, after every hold of research/historical/ci/archive-check.sh (arm, back-off,
# 3-failure stop, private store, request cap, one lane and the dispatch marker, 60 min
# pause, queue), one 64-byte request to the Old Faithful archive with the scanner's own
# User-Agent. If it is served, the dispatch marker is saved to the Actions cache and then
# the next allow-listed day is dispatched; if not, the step "Not served (counted
# failure)" fails, which is the countable record of that failure. Never another agent,
# host, address, proxy or client, and no retries inside a check.
#
# The checkout sets persist-credentials: false; the tokens reach only the check and
# dispatch steps.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      helius_runs:
        description: "data-scan run ids (digits and commas) to treat as Helius-only, for runs dispatched before data-scan's run-name; scheduled checks never set it"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: archive-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Holds, then one archive request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          HELIUS_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.helius_runs || '' }}
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_STORE_TOKEN: ${{ secrets.DATA_STORE_TOKEN }}
        run: research/historical/ci/archive-check.sh
      # The marker (UTC time and day only) is saved before the dispatch, so a later check
      # holds until the dispatched run is listed. A failed save skips the dispatch.
      - name: Save the dispatch marker
        if: steps.check.outputs.served == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/archive-dispatch
          key: ${{ steps.check.outputs.marker }}
      - name: Dispatch the day
        if: steps.check.outputs.served == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DAY: ${{ steps.check.outputs.day }}
        run: research/historical/ci/archive-check.sh --dispatch "$DAY"
      - name: Not served (counted failure)
        if: steps.check.outputs.served == 'false'
        run: |
          echo "the archive did not serve the check: one failure counted (archive-guard.sh); the back-off holds every request for 3 h"
          exit 1
