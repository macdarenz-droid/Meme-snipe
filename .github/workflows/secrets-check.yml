name: Secrets check

# Manual only. Confirms each API key works without printing any key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Helius
        env:
          KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "HELIUS_API_KEY: missing"; exit 1; }
          body=$(curl -s -m 15 -X POST "https://mainnet.helius-rpc.com/?api-key=$KEY" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getSlot"}')
          echo "$body" | grep -q '"result":[0-9]' && echo "HELIUS_API_KEY: works" || { echo "HELIUS_API_KEY: rejected"; exit 1; }
      - name: Alchemy
        env:
          KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "ALCHEMY_API_KEY: missing"; exit 1; }
          body=$(curl -s -m 15 -X POST "https://solana-mainnet.g.alchemy.com/v2/$KEY" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getSlot"}')
          echo "$body" | grep -q '"result":[0-9]' && echo "ALCHEMY_API_KEY: works on Solana mainnet" || { echo "ALCHEMY_API_KEY: rejected"; exit 1; }
      - name: Jupiter
        env:
          KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "JUPITER_API_KEY: missing"; exit 1; }
          code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' -H "x-api-key: $KEY" "https://api.jup.ag/tokens/v2/search?query=So11111111111111111111111111111111111111112")
          echo "JUPITER_API_KEY: HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN: missing"; exit 1; }
          body=$(curl -s -m 15 "https://api.telegram.org/bot$TOKEN/getMe")
          echo "$body" | grep -q '"ok":true' || { echo "TELEGRAM_BOT_TOKEN: rejected"; exit 1; }
          echo "TELEGRAM_BOT_TOKEN: works, bot @$(echo "$body" | sed -n 's/.*"username":"\([^"]*\)".*/\1/p')"
      - name: Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN: missing"; exit 1; }
          [ -n "$ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID: missing"; exit 1; }
          body=$(curl -s -m 15 "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" -H "Authorization: Bearer $TOKEN")
          echo "$body" | grep -q '"status":"active"' || { echo "CLOUDFLARE_API_TOKEN: rejected for this account"; exit 1; }
          echo "CLOUDFLARE_API_TOKEN: active for CLOUDFLARE_ACCOUNT_ID, expires $(echo "$body" | sed -n 's/.*"expires_on":"\([^"]*\)".*/\1/p')"
