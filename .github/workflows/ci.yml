name: CI

on:
  # Feature branches run through their pull request only (the push run was a duplicate of the same commit);
  # draft pull requests wait until they are marked ready, and a newer head cancels the older run.
  push:
    branches: [main, ccr-14987baf-i6lrsl]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # One run per pull request; every push to the base branches gets its own group, so none is dropped.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI-SHARD: the test suite runs in parallel shards, each file in exactly one (vitest --shard); `check` waits on
  # every shard and on typecheck and build, and passes only when all passed and the shards' reports cover the file
  # list exactly once. The name `check` is what OPS-GATE (ops/deploy/tag.sh, the host's zeroed-update) and the
  # preview release (.github/scripts/require-check.sh) read, so it stays the one verdict.
  static:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The full suite took 13 min 10 s to 13 min 34 s on the base (5 Oct) and passed 15 min with BT-2 #41's study tests,
    # so a passing run was cancelled. 30 min still stops a hung run; no test is skipped or shortened (supervisor, DECISIONS).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r --if-present build
      - name: The test file list the shards must cover
        run: pnpm exec vitest list --filesOnly --json > test-files.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-files
          path: test-files.json
          retention-days: 3

  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failure never hides another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same `vitest run` as `pnpm test`, one shard of it; the light and heavy worker caps (vitest.config.ts) hold per shard.
      - run: pnpm test --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json=shard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-${{ matrix.shard }}
          path: shard.json
          retention-days: 3

  check:
    # Runs when a shard or the static job failed too (not when the run was cancelled), so a failure is a red
    # `check`, never a skipped one.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard, typecheck and build passed
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "static: $STATIC; test shards: $TEST"
          [ "$STATIC" = success ] && [ "$TEST" = success ]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: reports
      - name: The shards ran every test file exactly once
        run: node .github/scripts/shard-cover.mjs reports/test-files/test-files.json reports/shard-*/shard.json

  historical-data:
    # DATA-1 scanner, QA verdict and CI script tests (offline; no archive access).
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GO_VERSION: "1.24.7"
      GO_SHA256: da18191ddb7db8a9339816f3e2b54bdded8047cdc2a5d67059478f8d1595c43f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Go (pinned by version and checksum)
        run: |
          curl -fsSLo go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf go.tgz && rm go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Scanner tests
        working-directory: research/historical/scanner
        run: go vet ./... && go test ./...
      - name: RPC scanner tests (DATA-2; the scanner's sources through symlinks)
        working-directory: research/historical/rpcscan
        run: go vet ./... && go test ./...
      - name: QA tests
        run: node --test research/historical/qa/*.test.mjs
      - name: CI script tests
        run: bash research/historical/ci/test-ci.sh
