name: Deploy

# Manual only (ops/README.md). Two jobs in one run:
# 1. Code: moves the "deploy" tag to the newest commit on the integration branch that GitHub signed (a pull
#    request merge). The host checks the same signature before it switches, and reconciles before trading.
# 2. Keys (when a host key and pairing code are given): encrypts the repository secrets to that host's age
#    key and publishes the ciphertext as a release asset for at most 15 minutes. Run again to rotate.
# No step prints a secret: no set -x, values pass only through env and pipes, nothing is cached or uploaded
# as an artifact.
on:
  workflow_dispatch:
    inputs:
      host_public_key:
        description: Host public key (age1..., printed by the installer). Leave empty for a code update only.
        required: false
        default: ''
      pairing_code:
        description: Pairing code (XXXX-XXXX-XXXX, printed by the installer).
        required: false
        default: ''
      backup_public_key:
        description: Your backup public key (age1...). Optional; backups are also encrypted to the host key.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/ccr-14987baf-i6lrsl'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move the deploy tag
        env:
          INTEGRATION_BRANCH: ccr-14987baf-i6lrsl
        run: bash ops/deploy/tag.sh

      - name: Install age
        if: ${{ !cancelled() && inputs.host_public_key != '' }}
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q age >/dev/null
          age --version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() && inputs.host_public_key != '' }}
        with:
          node-version: 22

      - name: Hand the keys to the host
        if: ${{ !cancelled() && inputs.host_public_key != '' }}
        env:
          HOST_PUBLIC_KEY: ${{ inputs.host_public_key }}
          PAIRING_CODE: ${{ inputs.pairing_code }}
          BACKUP_RECIPIENT: ${{ inputs.backup_public_key }}
          ISSUED: ${{ github.run_id }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: npx --yes wrangler@4.141.0 --config packages/ops/wrangler.toml
        run: bash ops/deploy/publish.sh

      - name: Remove the bundle
        if: ${{ always() && inputs.pairing_code != '' }}
        env:
          PAIRING_CODE: ${{ inputs.pairing_code }}
        run: |
          [[ "$PAIRING_CODE" =~ ^[A-Z0-9-]{14}$ ]] || exit 0
          gh release delete "pair-$PAIRING_CODE" --yes --cleanup-tag >/dev/null 2>&1 || true
