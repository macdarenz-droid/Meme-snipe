name: Deploy

# Manual only, no inputs (ops/README.md). Two steps in one run:
# 1. Code: moves the "deploy" tag to the newest commit on the integration branch that GitHub signed (a pull
#    request merge). The server checks the signature, the branch and the check runs before it switches,
#    and only with no open intent.
# 2. Keys (when the DEPLOY_CODE secret exists): encrypts the API keys for the server's one-time deploy code
#    and publishes the ciphertext as a release asset for at most 15 minutes. Rotation: a new code from the
#    server console (zeroed-new-deploy-code) in DEPLOY_CODE, then run again.
# No step prints a secret: no set -x, values pass only through env and pipes, nothing is cached or uploaded
# as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The job name is how tag.sh and the server leave this job's own check run out of the verdict.
    name: zeroed-deploy
    if: github.ref == 'refs/heads/ccr-14987baf-i6lrsl'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move the deploy tag
        env:
          INTEGRATION_BRANCH: ccr-14987baf-i6lrsl
        run: bash ops/deploy/tag.sh

      - name: Install age
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q age >/dev/null
          age --version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22

      - name: Hand the keys to the server
        if: ${{ !cancelled() }}
        env:
          DEPLOY_CODE: ${{ secrets.DEPLOY_CODE }}
          ISSUED: ${{ github.run_id }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: bash ops/deploy/publish.sh

      - name: Remove the handoff release
        if: ${{ always() }}
        run: gh release delete handoff --yes --cleanup-tag >/dev/null 2>&1 || true
