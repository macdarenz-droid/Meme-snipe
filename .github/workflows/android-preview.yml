name: Android preview

# Builds the Zeroed preview APK (apps/web wrapped with Capacitor). Pull requests and other branches
# upload it as a workflow artifact only. A push (or manual run) on the integration branch also
# replaces the single asset on the "preview" prerelease, so one fixed link always serves the newest build:
# https://github.com/macdarenz-droid/Meme-snipe/releases/download/preview/zeroed-preview.apk

on:
  push:
    branches: [ccr-14987baf-i6lrsl]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'brand/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-preview.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  INTEGRATION_BRANCH: ccr-14987baf-i6lrsl
  APP_ID: com.macdarenz.zeroed

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One build at a time per branch, so two runs never create different keystores on a cache miss.
    concurrency:
      group: android-preview-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        id: version
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "name=preview-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Web build with the preview flag
        run: pnpm --filter @meme-snipe/web build:preview

      - name: Sync into the Android project
        run: pnpm --filter @meme-snipe/web exec cap sync android

      - name: Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$mgr" --licenses > /dev/null || true
          "$mgr" "platforms;android-36" "build-tools;36.0.0"

      # Signing (SEC-1, docs/ANDROID_PREVIEW.md Keystore). Pull requests and other branches always sign with a
      # throwaway key made below and never see a stable one. The integration branch signs with the owner's
      # key from the PREVIEW_KEYSTORE_B64 secret, refused unless its certificate matches the
      # PREVIEW_CERT_SHA256 variable. Until the owner adds them, it keeps APP-1's cached key; any
      # pull-request workflow can restore that cache, so it is replaced, never trusted further.
      - name: Signing key
        id: signing
        env:
          INTEGRATION: ${{ github.ref == 'refs/heads/ccr-14987baf-i6lrsl' && github.event_name != 'pull_request' }}
          KEYSTORE_B64: ${{ secrets.PREVIEW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          CERT_SHA256: ${{ vars.PREVIEW_CERT_SHA256 }}
        run: bash .github/scripts/preview-signing.sh

      - name: Restore debug keystore
        id: keystore
        if: steps.signing.outputs.source == 'cache'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zeroed-preview/debug.keystore
          key: zeroed-preview-debug-keystore-v1

      - name: Create debug keystore (throwaway, or a cache miss)
        if: steps.signing.outputs.source == 'throwaway' || (steps.signing.outputs.source == 'cache' && steps.keystore.outputs.cache-hit != 'true')
        run: |
          mkdir -p ~/.zeroed-preview
          keytool -genkeypair -keystore ~/.zeroed-preview/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Zeroed preview debug,O=Zeroed,C=AU"

      - name: Build debug APK
        working-directory: apps/web/android
        env:
          ZEROED_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.source == 'secret' && secrets.PREVIEW_KEYSTORE_PASSWORD || '' }}
        run: |
          export ZEROED_DEBUG_KEYSTORE="${ZEROED_DEBUG_KEYSTORE:-$HOME/.zeroed-preview/debug.keystore}"
          ./gradlew --no-daemon assembleDebug \
            -PzeroedVersionCode='${{ steps.version.outputs.code }}' \
            -PzeroedVersionName='${{ steps.version.outputs.name }}'

      - name: Verify the APK
        env:
          SIGNING: ${{ steps.signing.outputs.source }}
          CERT_SHA256: ${{ vars.PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Build tools: $bt"
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          badging="$("$bt/aapt" dump badging "$apk")"
          echo "$badging" | grep -E "^package:|^application-label:"
          line="$(echo "$badging" | grep '^package:')"
          echo "$line" | grep -q "name='$APP_ID'"
          echo "$line" | grep -q "versionCode='${{ steps.version.outputs.code }}'"
          echo "$line" | grep -q "versionName='${{ steps.version.outputs.name }}'"
          if [ "$SIGNING" = secret ]; then APKSIGNER="$bt/apksigner" bash .github/scripts/verify-preview-cert.sh "$apk"; fi
          mkdir -p out
          cp "$apk" out/zeroed-preview.apk
          sha256sum out/zeroed-preview.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroed-preview-apk
          path: out/zeroed-preview.apk
          if-no-files-found: error
          retention-days: 14

  # Runs only for a push or manual run on the integration branch. Pull requests and every other
  # branch stop after the artifact above and never touch the release.
  release:
    needs: build
    if: github.ref == 'refs/heads/ccr-14987baf-i6lrsl' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-preview-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zeroed-preview-apk

      - name: Skip if a newer commit exists
        id: newest
        run: |
          head="$(gh api "repos/$GH_REPO/commits/$INTEGRATION_BRANCH" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$INTEGRATION_BRANCH moved to $head; a newer run publishes the release."
          fi

      # The owner's key only (SEC-1): the downloaded APK's one signer must match PREVIEW_CERT_SHA256.
      - name: Check the signing certificate
        if: steps.newest.outputs.current == 'true'
        env:
          CERT_SHA256: ${{ vars.PREVIEW_CERT_SHA256 }}
        run: bash .github/scripts/verify-preview-cert.sh zeroed-preview.apk

      - name: Move the preview tag, write the notes, replace the single asset
        if: steps.newest.outputs.current == 'true'
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: bash .github/scripts/publish-preview.sh
