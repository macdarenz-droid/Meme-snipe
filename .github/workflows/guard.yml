# Guard (B-M30-01; C01 review finding M3). CI runs the pull request's own copy of the policy code, so a pull request
# could weaken the check that reviews it. This workflow runs the BASE branch's copy of the drift check against the pull
# request instead: on pull_request_target, GitHub runs this file as it is on the default branch, never the pull
# request's version. The pull request's merge commit is checked out into pr/ as data only: nothing from it is
# installed, cached or executed (GitHub: "Avoid using this event if you need to build or run code from the pull
# request"). Read-only token, no secrets, credentials not persisted. The check fails until a reviewer adds the
# deps-reviewed:<hash> label whenever the lockfile or a policy file changed (tools/policy/drift.ts). Until this file
# is on the default branch, GitHub does not run it.
name: guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Base branch (trusted code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: base
          persist-credentials: false
      - name: Pull request merge commit (data only, never executed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: base/.node-version
      - name: Lockfile and policy file changes need the deps-reviewed:<hash> label (base branch's check)
        working-directory: pr
        env:
          POLICY_BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node ../base/tools/policy/bin/drift.ts
