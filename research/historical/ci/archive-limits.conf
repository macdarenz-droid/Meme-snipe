# Archive download limits (ARCHIVE-SAFE, owner order 2026-10-05): the one place for
# them. A rate published by Triton (the archive's operator) replaces these numbers here.
# Read by scan-day.sh, check-day.sh and archive-check.sh; data-scan.yml's max_mbps
# default and check must equal ARCHIVE_MAX_MBPS (test-ci checks).
ARCHIVE_MAX_MBPS=40        # MB/s (1 MB = 1e6 bytes), whole process
ARCHIVE_MAX_RPS=10         # request starts per second; the scanner's cap (scanner/archive.go reqLimiter) must not exceed it, or archive-check dispatches nothing
ARCHIVE_PARALLEL=1         # units scanned at once
ARCHIVE_DL=4               # chunk downloads per unit: at most PARALLEL x DL = 4 connections
ARCHIVE_BACKOFF_S=10800    # after any 429 (or 503 with Retry-After): at least 3 h, and the chain stops
ARCHIVE_DAYS_PER_CHECK=1   # days dispatched per served archive-check (every 3 h)
# Days read over Helius RPC (source helius), and no others (ARCHIVE-NODUP, owner
# 2026-10-05: never download a day twice). archive-check.sh never queues them for the
# archive; rpc-day.sh refuses any other day. Space-separated UTC days; a day is added
# here, by a reviewed change, before its first Helius dispatch.
HELIUS_DAYS="2026-09-21"
# OF-2 (research/z-h-estimate/OLD-FAITHFUL.md §2): the one source of truth for which days
# the archive is read for, and whether the chain may run at all. archive-guard.sh reads
# these for every entry point (archive-check.sh, the data-scan plan job, scan-day.sh,
# check-day.sh). Each value is set only in the same reviewed change as its row in
# docs/DECISIONS.md.
# ARCHIVE_DAYS: the allow-list, oldest first (days, or FROM..TO inclusive): 2026-07-22
# (lead-in) and the 30 decision days 07-23..08-21. Never 09-21 (HELIUS_DAYS), never
# 09-22 or later (B3 holdout), never before 07-22 (archive-guard.sh refuses those even if
# listed); 08-22..09-20 only after the owner says yes to 60 days.
ARCHIVE_DAYS="2026-07-22..2026-08-21"
# ARCHIVE_ARM: empty = unarmed, nothing is read. Armed only when it equals the id of the
# one pinned B10-PULL row in docs/DECISIONS.md, set by the last reviewed change after
# OF-1 to OF-7 have merged.
ARCHIVE_ARM=""
# ARCHIVE_REARM_AT: failures count from this UTC time. A reviewed change moves it forward
# to re-arm after a 3-failure stop (reason and the owner's message in HANDOVER), never
# before the last back-off has ended.
ARCHIVE_REARM_AT="2026-10-07T22:30:00Z"
# ARCHIVE_RETENTION: empty = only 2026-07-22 (K2, measurement day 1); K2 = 07-22 and
# 07-23 only (the two measurement days, set by the arming change); K3 = every
# allow-listed day (set before batch 3 with the measured sizes, OF-3). A unit read again
# keeps its day's recorded retention.
ARCHIVE_RETENTION=""
# ARCHIVE_K2_PEAK_BYTES (OF-3 ruling 3): free disk scan-day.sh needs before any archive
# read. Every day is read at K2 (raw for every canonical pool) and trimmed after the whole
# day, deleting each unit's K2 raw as it is trimmed, so the peak is the K2 day's units:
# 45 GB at the high estimate (OLD-FAITHFUL.md §3, RESULTS:348; October activity, VERIFY on
# batch 1) + one trimmed unit + 5 GB headroom, rounded up to 55 GB. QA runs after the K2
# raw is gone. If batch 1 shows a K2 day does not fit, the chain stops before batch 3.
ARCHIVE_K2_PEAK_BYTES=55000000000
# ARCHIVE_TRIM_HEADROOM_BYTES (OF-3 ruling 14): while a K2 day is read, scan-day.sh stops
# the scan between units (exit 75) when free space falls below the largest unit so far +
# this headroom (the trim writes one unit's K3 copy before deleting its K2 copy).
ARCHIVE_TRIM_HEADROOM_BYTES=5000000000
# ARCHIVE_TRIM_BUDGET_S (OF-3 ruling 15): the trim's own time budget; trim-day.sh stops
# resumably (exit 75) between units once it is spent. VERIFY on batch 1.
ARCHIVE_TRIM_BUDGET_S=1800
