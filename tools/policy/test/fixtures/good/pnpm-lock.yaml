lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: 6.0.3
        version: 6.0.3

  packages/contract: {}

  packages/engine:
    dependencies:
      '@bot/types':
        specifier: workspace:*
        version: link:../types
      '@bot/venue':
        specifier: workspace:*
        version: link:../venue

  packages/sentinel:
    dependencies:
      '@bot/venue':
        specifier: workspace:*
        version: link:../venue
      '@solana/kit':
        specifier: 8.4.0
        version: 8.4.0

  packages/signer:
    dependencies:
      '@bot/types':
        specifier: workspace:*
        version: link:../types

  packages/types: {}

  packages/venue:
    dependencies:
      '@bot/types':
        specifier: workspace:*
        version: link:../types
      '@solana/kit':
        specifier: 8.4.0
        version: 8.4.0

packages:

  '@solana/addresses@8.4.0':
    resolution: {integrity: sha512-fixtureAddressesIntegrityHashNotARealOne==}

  '@solana/kit@8.4.0':
    resolution: {integrity: sha512-fixtureKitIntegrityHashNotARealOne==}
    engines: {node: '>=20.18.0'}

  typescript@6.0.3:
    resolution: {integrity: sha512-fixtureTypescriptIntegrityHashNotARealOne==}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  '@solana/addresses@8.4.0': {}

  '@solana/kit@8.4.0':
    dependencies:
      '@solana/addresses': 8.4.0

  typescript@6.0.3: {}
