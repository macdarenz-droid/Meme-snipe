name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000001 # fixture
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0000000000000000000000000000000000000003 # fixture
      - run: pnpm install --frozen-lockfile
      - run: node tools/policy/bin/installed.ts
      - run: node tools/policy/bin/drift.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - shell: bash
        run: pnpm test 2>&1 | tee test-output.log
      - run: node tools/policy/bin/secrets.ts test-output.log
      - run: node tools/policy/bin/audit.ts
      - run: node tools/policy/bin/age.ts
