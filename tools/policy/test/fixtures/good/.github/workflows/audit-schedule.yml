name: audit-schedule
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000001 # fixture
        continue-on-error: true
        with:
          persist-credentials: false
      - continue-on-error: true
        shell: bash
        env:
          POLICY_EVENT: ${{ github.event_name }}
        run: node tools/policy/bin/audit.ts > advisories.txt 2>&1 || true
      - continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title x --body-file advisories.txt
